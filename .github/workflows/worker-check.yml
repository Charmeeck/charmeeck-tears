name: Check multi-streamer DonationAlerts integration
on:
  push:
    branches:
      - refactor/multistream-oauth
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare Worker syntax
        run: node --input-type=module --check < worker/src/index.js
      - name: Check per-streamer live bridge
        run: node --check da-cloudflare.js
      - name: Check inline scripts in widget and admin pages
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path("widget/index.html"),
              Path("widget/test.html"),
              Path("admin.html")
          ]
          out = Path("/tmp/tears-inline-checks")
          out.mkdir(exist_ok=True)
          count = 0
          for target in targets:
              source = target.read_text(encoding="utf-8")
              cursor = 0
              index = 0
              while True:
                  start = source.find("<script", cursor)
                  if start < 0:
                      break
                  open_end = source.find(">", start)
                  close = source.find("</script>", open_end)
                  if open_end < 0 or close < 0:
                      raise SystemExit("Malformed script tag in " + str(target))
                  code = source[open_end + 1:close]
                  if code.strip():
                      (out / f"{target.stem}-{index}.js").write_text(code, encoding="utf-8")
                      count += 1
                  index += 1
                  cursor = close + len("</script>")
          if count == 0:
              raise SystemExit("No inline scripts were found to validate.")
          print(f"Prepared {count} inline scripts for syntax validation.")
          PY
          for file in /tmp/tears-inline-checks/*.js; do node --check "$file"; done
      - name: Validate D1 schema and per-streamer separation
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          db.executescript(Path("worker/migrations/0001_initial.sql").read_text(encoding="utf-8"))

          account_sql = """INSERT INTO accounts
            (account_id,da_user_id,username,payload_enc,token_expires_at,current_amount,goal_amount,currency,widget_key_hash,widget_key_enc,created_at,updated_at)
            VALUES (?,?,?,?,?,?,?,?,?,?,?,?)"""
          def add_account(account_id, da_user_id, widget_hash):
              db.execute(account_sql, (
                  account_id, da_user_id, "Streamer " + account_id, "encrypted",
                  9999999999999, 100, 1000, "RUB", widget_hash, "encrypted-key",
                  "2026-11-12T00:00:00Z", "2026-11-12T00:00:00Z"
              ))

          add_account("a1", "da-user-1", "widget-hash-1")
          add_account("a2", "da-user-2", "widget-hash-2")

          db.execute("""INSERT INTO donations
            (account_id,donation_id,username,amount,currency,message,created_at,counted)
            VALUES ('a1','same-da-event','Alice',50,'RUB','','2026-11-12T00:00:00Z',1)""")
          db.execute("""INSERT OR IGNORE INTO donations
            (account_id,donation_id,username,amount,currency,message,created_at,counted)
            VALUES ('a1','same-da-event','Alice',50,'RUB','','2026-11-12T00:00:00Z',1)""")
          db.execute("""INSERT INTO donations
            (account_id,donation_id,username,amount,currency,message,created_at,counted)
            VALUES ('a2','same-da-event','Bob',70,'RUB','','2026-11-12T00:00:00Z',1)""")

          rows = db.execute(
              "SELECT account_id,COUNT(*) FROM donations GROUP BY account_id ORDER BY account_id"
          ).fetchall()
          assert rows == [("a1", 1), ("a2", 1)], rows
          assert db.execute("SELECT COUNT(*) FROM accounts").fetchone()[0] == 2
          assert db.execute(
              "SELECT account_id FROM accounts WHERE widget_key_hash='widget-hash-1'"
          ).fetchone()[0] == "a1"
          print("D1 schema OK: accounts, widget keys, sessions and donation IDs are tenant-scoped.")
          PY
