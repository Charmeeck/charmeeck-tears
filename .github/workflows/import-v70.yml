name: Import approved Tears v70
on:
  push:
    branches:
      - integration/donationalerts
permissions:
  contents: write
jobs:
  import-v70:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/donationalerts
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image converter
        run: python -m pip install Pillow
      - name: Restore v70 pages and convert transparent artwork
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from PIL import Image
          import re

          archive_path = Path("tears70.zip")
          if not archive_path.exists():
              raise SystemExit("Archive tears70.zip is missing from this branch.")

          out = Path("widget")
          assets_out = out / "assets"
          assets_out.mkdir(parents=True, exist_ok=True)

          with ZipFile(archive_path) as z:
              names = set(z.namelist())
              for required in ("widget.html", "Проверка_заполнения.html", "README_v70.txt"):
                  if required not in names:
                      raise SystemExit("Archive is missing: " + required)

              for name in names:
                  if not name.startswith("assets/") or not name.lower().endswith(".png"):
                      continue
                  asset_name = Path(name).name
                  with z.open(name) as stream:
                      image = Image.open(stream).convert("RGBA")
                  destination = assets_out / (Path(asset_name).stem + ".webp")
                  if asset_name in ("liquid_mask.png", "sphere_mask.png"):
                      image.save(destination, "WEBP", lossless=True, method=6)
                  else:
                      image.save(destination, "WEBP", quality=96, method=6)

              production = z.read("widget.html").decode("utf-8")
              test_page = z.read("Проверка_заполнения.html").decode("utf-8")
              readme = z.read("README_v70.txt").decode("utf-8")

          def patch_page(html, production_page):
              html = re.sub(r'(assets/[A-Za-z0-9_-]+)\.png', r'\1.webp', html)
              old_goal = "const goal=Math.max(1,readNumber(params.get('goal'),10000));"
              new_goal = """let goal=Math.max(1,readNumber(params.get('goal'),10000));
          let currency=String(params.get('currency')||'RUB').toUpperCase();
          const fmt=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
          const currencySymbols={RUB:'₽',USD:'$',EUR:'€',KZT:'₸',UAH:'₴',BYN:'Br',BRL:'R$',TRY:'₺'};
          const formatAmount=value=>fmt.format(value)+' '+(currencySymbols[currency]||currency);"""
              if old_goal not in html:
                  raise SystemExit("Could not locate the v70 goal initialization.")
              html = html.replace(old_goal, new_goal, 1)
              fmt_line = "  const fmt=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});"
              first = html.find(fmt_line)
              last = html.rfind(fmt_line)
              if last != first and last >= 0:
                  html = html[:last] + html[last + len(fmt_line):]
              html = html.replace("fmt.format(current)+' ₽'", "formatAmount(current)")
              html = html.replace("fmt.format(goal)+' ₽'", "formatAmount(goal)")
              html = html.replace("fmt.format(value)+' ₽'", "formatAmount(value)")
              api_old = """  window.TearsWidget={
            triggerDonation:(amount,donorName,eventId)=>triggerDonation(amount,donorName,eventId),
            getState:()=>({current,goal,percent:clamp(current/goal*100,0,100)})
          };"""
              api_new = """  window.TearsWidget={
            setBaseline:(state={})=>{
              const nextCurrent=Number(state.current_amount);
              const nextGoal=Number(state.goal_amount);
              if(Number.isFinite(nextCurrent)&&nextCurrent>=0)current=nextCurrent;
              if(Number.isFinite(nextGoal)&&nextGoal>0)goal=nextGoal;
              const nextCurrency=String(state.currency||currency||'RUB').toUpperCase();
              if(currencySymbols[nextCurrency])currency=nextCurrency;
              document.getElementById('currentLabel').textContent=formatAmount(current);
              document.getElementById('goalLabel').textContent=formatAmount(goal);
              transitionFrom=shownPercent;
              targetPercent=clamp(current/goal*100,0,100);
              transitionStart=performance.now();
              if(targetPercent>=99.95){wasFull=false;completionStarted=-1;}
            },
            triggerDonation:(amount,donorName,eventId)=>triggerDonation(amount,donorName,eventId),
            getState:()=>({current,goal,currency,percent:clamp(current/goal*100,0,100)})
          };"""
              if api_old not in html:
                  raise SystemExit("Could not locate the v70 TearsWidget API.")
              html = html.replace(api_old, api_new, 1)
              if production_page:
                  html = html.replace("  const status=document.getElementById('testStatus');", "  const status=null;")
                  html = html.replace(" — динамические суммы v70", " — v70")
                  if '</body>' not in html:
                      raise SystemExit("Production HTML has no body close tag.")
                  html = html.replace("</body>", '<script src="../config.js"></script>\n<script src="../da-cloudflare.js"></script>\n</body>', 1)
              return html

          out.mkdir(parents=True, exist_ok=True)
          (out / "index.html").write_text(patch_page(production, True), encoding="utf-8")
          (out / "test.html").write_text(patch_page(test_page, False), encoding="utf-8")
          (out / "README_v70.txt").write_text(readme, encoding="utf-8")
          (out / "README.md").write_text("""# Донат-бар «Слёзы» — v70

          Основная страница для OBS: `index.html`.
          Автономная проверка внешнего вида и реакций: `test.html`.

          В production-виджет перенесена утверждённая версия v70: прозрачные слои колбы,
          маска уровня жидкости, анимация пузырьков, эффект завершения сбора и три уровня
          реакции на донат (до 499 ₽, 500–1 999 ₽ и от 2 000 ₽).

          После настройки Cloudflare Worker страница загружает начальную сумму, цель и
          валюту через `../config.js` и `../da-cloudflare.js`. OAuth-секреты и токены
          в репозитории не хранятся.

          Для OBS используй:
          `https://charmeeck.github.io/charmeeck-tears/widget/`
          Размер источника: 1774 × 887.
          """, encoding="utf-8")
          print("v70 pages restored and transparent WebP assets prepared.")
          PY
      - name: Commit imported v70 files and remove this one-off workflow
        run: |
          rm .github/workflows/import-v70.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add widget .github/workflows/import-v70.yml
          git commit -m "Import approved Tears Widget v70"
          git push origin HEAD:integration/donationalerts
