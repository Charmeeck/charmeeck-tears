name = "tears-donationalerts"
main = "src/index.js"
compatibility_date = "2026-11-11"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "tears-donations"
database_id = "9405bf2e-ead2-4d7c-8f12-edb7b4f2f9dc"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "LISTENER"
class_name = "DonationAlertsListener"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DonationAlertsListener"]

[vars]
WORKER_BASE_URL = "https://tears-donationalerts.charmwizard.workers.dev"
ALLOWED_ORIGIN = "https://charmeeck.github.io"
ADMIN_PAGE_URL = "https://charmeeck.github.io/charmeeck-tears/admin.html"
WIDGET_PAGE_URL = "https://charmeeck.github.io/charmeeck-tears/widget/"
