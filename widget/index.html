<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Донат-бар «Слёзы» — v74</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { display: grid; place-items: center; }
  .stage { position: relative; width: min(100vw, 200vh); aspect-ratio: 1774 / 887; overflow: visible; container-type:inline-size; }
  .layer { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; }
  #base { z-index: 1; }
  #personInside { z-index: 2; }
  #dryGlass { z-index: 3; }
  #liquid { z-index: 4; }
  #completionGlow { z-index: 5; }
  #donationFx { z-index: 6; }
  #glassReflections { z-index: 7; }
  #frontDetails { z-index: 8; }
  #centerOrnament { z-index: 11; transform: translateY(-3px); }

  .amount-label {
    position:absolute; top:calc(79.5% + 9px); height:7.2%; transform:translate(-50%, -50%); z-index:8;
    display:grid; place-items:center;
    color:#f5f7ff; font-family:Georgia, "Times New Roman", serif;
    font-size:clamp(22px, min(2.75vw, 5.5vh), 49px); font-weight:600;
    line-height:1; letter-spacing:0; white-space:nowrap; font-variant-position:normal;
    text-align:center; text-shadow:none; -webkit-font-smoothing:antialiased;
    pointer-events:none; font-variant-numeric:lining-nums tabular-nums;
  }
  #currentLabel { left:25%; width:23%; }
  #goalLabel { left:75%; width:23%; }

  .settings-panel{max-width:1100px;margin:12px auto 22px;padding:14px;background:#18243a;border:1px solid #405579;border-radius:12px;color:#f4f6ff}
  .settings-grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:12px 22px;margin-top:12px}
  .setting{display:flex;flex-direction:column;gap:6px;font-size:14px}
  .setting-head{display:flex;justify-content:space-between;gap:10px;color:#dce8fc}
  .setting input[type=range]{width:100%;accent-color:#49bfe9}
  .setting-toggle{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14px;color:#dce8fc}
  .setting-toggle input{accent-color:#49bfe9;width:16px;height:16px}
  .settings-output{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .settings-output input{flex:1;min-width:260px;background:#101a2b;border:1px solid #405579;border-radius:7px;color:#cfe6ff;padding:9px;font:13px Consolas,monospace}
  .settings-output button{padding:9px 13px;border-radius:8px;border:1px solid #627da8;background:#263c60;color:#fff;font-weight:700;cursor:pointer}
  @media(max-width:650px){.settings-grid{grid-template-columns:1fr}}


  #glassReflections { z-index: 7; }
  #frontDetails { z-index: 8; }
  #donationFx { z-index: 6; }
  #donationToast {
    position:absolute; left:25%; top:68.2%; z-index:9;
    transform:translate(-50%,8px) scale(.96);
    max-width:27%; padding:7px 13px;
    border:1px solid rgba(137,211,255,.58);
    border-radius:999px;
    color:#f4fbff; background:linear-gradient(180deg,rgba(23,72,116,.94),rgba(8,25,52,.94));
    box-shadow:0 0 16px rgba(36,173,242,.32), inset 0 1px 0 rgba(255,255,255,.18);
    font:600 clamp(12px,1.25vw,20px)/1.1 Georgia,"Times New Roman",serif;
    text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    opacity:0; pointer-events:none;
    transition:opacity .18s ease,transform .22s ease;
  }
  #donationToast.show { opacity:1; transform:translate(-50%,0) scale(1); }
  #donationToast .donor-name { color:#9ceaff; }
  @media(max-width:700px){#donationToast{max-width:32%;padding:5px 8px}}

  @media (max-aspect-ratio: 1774/887) { .stage { width: 100vw; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="layer" id="base" src="assets/base_cutout.png" alt="">
  <img class="layer" id="personInside" src="assets/person_inside.png" alt="">
  <img class="layer" id="dryGlass" src="assets/dry_glass.png" alt="">
  <canvas class="layer" id="liquid" width="1774" height="887" aria-hidden="true"></canvas>
  <canvas class="layer" id="completionGlow" width="1774" height="887" aria-hidden="true"></canvas>
  <canvas class="layer" id="donationFx" width="1774" height="887" aria-hidden="true"></canvas>
  <img class="layer" id="glassReflections" src="assets/glass_reflections.png" alt="">
  <img class="layer" id="frontDetails" src="assets/front_details.png" alt="">
  <img class="layer" id="centerOrnament" src="assets/center_ornament.png" alt="">
  <div class="amount-label" id="currentLabel" aria-label="Текущая сумма">3 750 ₽</div>
  <div id="donationToast" role="status" aria-live="polite"></div>
  <div class="amount-label" id="goalLabel" aria-label="Цель">10 000 ₽</div>
</div>

<script>
(() => {
  'use strict';
  const W=1774,H=887;
  const params=new URLSearchParams(location.search);
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const readNumber=(v,d)=>{if(v===null||v.trim()==='')return d;const n=Number(v.replace(',','.'));return Number.isFinite(n)?n:d;};
  let current=Math.max(0,readNumber(params.get('current'),3750));
  let goal=Math.max(1,readNumber(params.get('goal'),10000));
let currency=String(params.get('currency')||'RUB').toUpperCase();
const fmt=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const currencySymbols={RUB:'₽',USD:'$',EUR:'€',KZT:'₸',UAH:'₴',BYN:'Br',BRL:'R$',TRY:'₺'};
const formatAmount=value=>fmt.format(value)+' '+(currencySymbols[currency]||currency);
  const requestedPercent=params.has('percent')?readNumber(params.get('percent'),current/goal*100):current/goal*100;
  let targetPercent=clamp(requestedPercent,0,100);
  
  document.getElementById('currentLabel').textContent=formatAmount(current);
  document.getElementById('goalLabel').textContent=formatAmount(goal);

  const instant=params.get('instant')==='1';
  const settingNumber=(key,def,min,max)=>clamp(readNumber(params.get(key),def),min,max);
  const liquidSettings={
    wave:settingNumber('wave',1.15,0,2),
    bubbles:settingNumber('bubbles',1.55,0,2.2),
    glow:params.get('glow')!=='0',
    celebration:params.get('celebration')!=='0'
  };

  const canvas=document.getElementById('liquid'),ctx=canvas.getContext('2d');
  const buffer=document.createElement('canvas');buffer.width=W;buffer.height=H;
  const bctx=buffer.getContext('2d');
  const surfaceCanvas=document.createElement('canvas');surfaceCanvas.width=W;surfaceCanvas.height=H;
  const surfaceCtx=surfaceCanvas.getContext('2d');
  const glowCanvas=document.getElementById('completionGlow'),glowCtx=glowCanvas.getContext('2d');
  const donationCanvas=document.getElementById('donationFx'),donationCtx=donationCanvas.getContext('2d');
  const donationBuffer=document.createElement('canvas');donationBuffer.width=W;donationBuffer.height=H;
  const donationBufferCtx=donationBuffer.getContext('2d');
  const donationToast=document.getElementById('donationToast');
  const maskImage=new Image();
  const status=null;
  const cx=892,rx=123,cy=728.5,ry=94.5,top=634,bottom=823;
  const rowWidths=new Float32Array(H);let totalArea=0;
  for(let y=top;y<=bottom;y++){
    const q=(y-cy)/ry;
    const width=2*rx*Math.sqrt(Math.max(0,1-q*q));
    rowWidths[y]=width;totalArea+=width;
  }
  function levelFor(p){
    if(p<=0)return bottom+2;
    if(p>=100)return top-1;
    const wanted=totalArea*p/100;let sum=0;
    for(let y=bottom;y>=top;y--){sum+=rowWidths[y];if(sum>=wanted)return y;}
    return top;
  }

  let transitionFrom=instant?targetPercent:0;
  let shownPercent=transitionFrom;
  let transitionStart=performance.now();
  const duration=1450;
  let lastFrame=0;
  let wasFull=false;
  let completionStarted=-1;
  let lastDonationToast=0;
  const activeDonations=[];
  const seenDonationIds=new Set();
  const MEDIUM_DONATION=500;
  const LARGE_DONATION=2000;
  let donationToastTimer=null;

  function drawSparkle(c,x,y,r,alpha,phase){
    c.save();
    c.translate(x,y);
    c.rotate(phase*0.22);
    c.globalAlpha=alpha;
    c.shadowBlur=9;
    c.shadowColor='rgba(111,220,255,0.9)';
    c.fillStyle='rgba(220,250,255,0.95)';
    c.beginPath();
    c.moveTo(0,-r);c.quadraticCurveTo(r*0.12,-r*0.12,r,0);
    c.quadraticCurveTo(r*0.12,r*0.12,0,r);
    c.quadraticCurveTo(-r*0.12,r*0.12,-r,0);
    c.quadraticCurveTo(-r*0.12,-r*0.12,0,-r);
    c.closePath();c.fill();
    c.restore();
  }

  function drawCompletion(percent,time){
    glowCtx.clearRect(0,0,W,H);
    if(percent<99.95)return;

    const eventPulse=completionStarted>=0?Math.max(0,1-(time-completionStarted)/6200):0;
    const breath=0.5+0.5*Math.sin(time*0.0018);
    const strength=liquidSettings.glow?(0.20+eventPulse*0.78+breath*0.09):0;

    if(strength>0){
      glowCtx.save();
      glowCtx.globalCompositeOperation='lighter';

      // Broad cool halo behind the vessel.
      const halo=glowCtx.createRadialGradient(cx,cy,78,cx,cy,188);
      halo.addColorStop(0,'rgba(33,156,255,0)');
      halo.addColorStop(0.48,`rgba(38,163,255,${strength*0.10})`);
      halo.addColorStop(0.78,`rgba(43,187,255,${strength*0.14})`);
      halo.addColorStop(1,'rgba(38,163,255,0)');
      glowCtx.fillStyle=halo;
      glowCtx.beginPath();
      glowCtx.ellipse(cx,cy,188,150,0,0,Math.PI*2);
      glowCtx.fill();

      // Two softly pulsing outlines make the completed flask feel energized.
      const ringPulse=0.86+0.14*Math.sin(time*0.003);
      glowCtx.lineWidth=8;
      glowCtx.shadowBlur=30;
      glowCtx.shadowColor='rgba(44,191,255,0.95)';
      glowCtx.strokeStyle=`rgba(44,188,255,${strength*0.58*ringPulse})`;
      glowCtx.beginPath();
      glowCtx.ellipse(cx,cy,136+breath*2,108+breath*2,0,0,Math.PI*2);
      glowCtx.stroke();

      glowCtx.lineWidth=2.4;
      glowCtx.shadowBlur=14;
      glowCtx.strokeStyle=`rgba(190,246,255,${strength*0.42})`;
      glowCtx.beginPath();
      glowCtx.ellipse(cx,cy,144+breath*3,116+breath*3,0,0,Math.PI*2);
      glowCtx.stroke();
      glowCtx.restore();
    }

    if(liquidSettings.celebration){
      // A burst appears when the level first reaches 100%, then settles into gentle twinkles.
      const burst=eventPulse;
      const idle=0.22+0.10*breath;
      const alpha=Math.max(idle,burst);
      const points=[
        [750,727,6],[1033,727,6],[838,590,5],[943,590,5],
        [892,850,5],[780,810,4],[1002,810,4],[818,650,3.5],
        [966,650,3.5],[852,618,3.3],[932,618,3.3],[892,610,4.2]
      ];
      points.forEach((p,i)=>{
        const flicker=0.38+0.62*Math.sin(time*0.0065+i*1.37);
        const burstBoost=1+burst*0.65;
        drawSparkle(glowCtx,p[0],p[1],p[2]*(0.78+0.28*flicker)*burstBoost,
          alpha*flicker*0.72,time+i);
      });

      // Tiny floating glints travel upward around the glass at full level.
      for(let i=0;i<10;i++){
        const t=(time*0.00018+i*0.137)%1;
        const side=i%2===0?-1:1;
        const x=cx+side*(130+7*Math.sin(time*0.001+i));
        const y=cy+72-t*155;
        const r=1.0+(i%3)*0.45;
        glowCtx.save();
        glowCtx.globalAlpha=(0.16+0.24*breath)*(0.45+0.55*Math.sin(t*Math.PI));
        glowCtx.shadowBlur=8;
        glowCtx.shadowColor='rgba(118,226,255,0.9)';
        glowCtx.fillStyle='rgba(220,250,255,0.95)';
        glowCtx.beginPath();glowCtx.arc(x,y,r,0,Math.PI*2);glowCtx.fill();
        glowCtx.restore();
      }
    }
  }

  function drawDonationEffects(time){
    donationBufferCtx.clearRect(0,0,W,H);
    const live=[];
    const shown=clamp(shownPercent,0,100);
    const liquidSurface=levelFor(shown)+6;

    for(const event of activeDonations){
      const age=(time-event.started)/1000;
      if(age>3.6)continue;
      live.push(event);
      const p=clamp(age/2.8,0,1);
      const fade=age<0.35?age/0.35:Math.max(0,1-(age-0.35)/3.25);
      const strength=event.strength;
      const count=event.particles;

      // Concentric ripples travel outward from the point where the donation hits the water.
      for(let ring=0;ring<2;ring++){
        const rp=clamp((age-ring*0.18)/1.25,0,1);
        if(rp<=0)continue;
        donationBufferCtx.save();
        donationBufferCtx.globalAlpha=(1-rp)*fade*0.46*strength;
        donationBufferCtx.strokeStyle=ring===0?'rgba(208,250,255,0.95)':'rgba(69,213,255,0.76)';
        donationBufferCtx.lineWidth=ring===0?1.5:1;
        donationBufferCtx.shadowBlur=8;
        donationBufferCtx.shadowColor='rgba(93,222,255,0.9)';
        donationBufferCtx.beginPath();
        donationBufferCtx.ellipse(cx,liquidSurface+11,12+rp*(event.tier==='large'?104:(event.tier==='medium'?92:76)),3+rp*(event.tier==='large'?17:13),0,0,Math.PI*2);
        donationBufferCtx.stroke();
        donationBufferCtx.restore();
      }

      // Rising bubbles and droplets form a short fountain inside the liquid.
      for(let i=0;i<count;i++){
        const offset=(i*0.61803398875+event.seed)%1;
        const local=clamp((age*0.72+offset*0.48)%1.12,0,1);
        const angle=i*2.3999632297+event.seed*6.28;
        const spread=(8+local*(event.tier==='large'?61:43));
        const x=cx+Math.cos(angle)*spread+Math.sin(age*3+i)*2.1;
        const y=liquidSurface+55-local*(event.tier==='large'?51:42);
        const r=(0.75+(i%4)*0.36)*(event.tier==='large'?1.12:1);
        const alpha=fade*(0.25+0.55*Math.sin(Math.PI*Math.min(local,1)));
        const bubbleGrad=donationBufferCtx.createRadialGradient(x-r*.35,y-r*.42,0,x,y,r*1.45);
        bubbleGrad.addColorStop(0,'rgba(245,255,255,0.96)');
        bubbleGrad.addColorStop(.35,'rgba(145,238,255,0.64)');
        bubbleGrad.addColorStop(1,'rgba(38,160,225,0.04)');
        donationBufferCtx.save();
        donationBufferCtx.globalAlpha=alpha;
        donationBufferCtx.fillStyle=bubbleGrad;
        donationBufferCtx.beginPath();
        donationBufferCtx.arc(x,y,r,0,Math.PI*2);
        donationBufferCtx.fill();
        donationBufferCtx.strokeStyle='rgba(208,250,255,0.66)';
        donationBufferCtx.lineWidth=.7;
        donationBufferCtx.beginPath();
        donationBufferCtx.arc(x,y,r,Math.PI*1.05,Math.PI*1.8);
        donationBufferCtx.stroke();
        donationBufferCtx.restore();

        if(event.tier!=='small'&&i%3===0){
          drawSparkle(donationBufferCtx,x,y-5,r*1.45,alpha*.62,time+i);
        }
      }

      // Large gifts create a brighter, broader flash inside the flask.
      if(event.tier==='large'&&age<1.15){
        const pulse=1-age/1.15;
        donationBufferCtx.save();
        donationBufferCtx.globalCompositeOperation='lighter';
        donationBufferCtx.globalAlpha=pulse*.18;
        const flash=donationBufferCtx.createRadialGradient(cx,liquidSurface+28,3,cx,liquidSurface+28,96);
        flash.addColorStop(0,'rgba(219,253,255,0.95)');
        flash.addColorStop(.36,'rgba(72,211,255,0.48)');
        flash.addColorStop(1,'rgba(25,137,214,0)');
        donationBufferCtx.fillStyle=flash;
        donationBufferCtx.beginPath();
        donationBufferCtx.ellipse(cx,liquidSurface+28,96,54,0,0,Math.PI*2);
        donationBufferCtx.fill();
        donationBufferCtx.restore();
      }
    }

    activeDonations.length=0;
    activeDonations.push(...live);
    donationCtx.clearRect(0,0,W,H);
    donationBufferCtx.globalCompositeOperation='destination-in';
    donationBufferCtx.drawImage(maskImage,0,0,W,H);
    donationBufferCtx.globalCompositeOperation='source-over';
    donationCtx.drawImage(donationBuffer,0,0);
  }

  function triggerDonation(amount,donorName='',eventId=''){
    const value=Number(amount);
    if(!Number.isFinite(value)||value<=0)return false;
    const dedupeKey=String(eventId||'').trim();
    if(dedupeKey&&seenDonationIds.has(dedupeKey))return false;
    if(dedupeKey){
      seenDonationIds.add(dedupeKey);
      if(seenDonationIds.size>1200)seenDonationIds.delete(seenDonationIds.values().next().value);
    }

    const now=performance.now();
    const tier=value>=LARGE_DONATION?'large':(value>=MEDIUM_DONATION?'medium':'small');
    const config=tier==='large'?{strength:1.7,particles:24}:tier==='medium'?{strength:1.25,particles:16}:{strength:0.9,particles:10};

    current+=value;
    document.getElementById('currentLabel').textContent=formatAmount(current);
    transitionFrom=shownPercent;
    targetPercent=clamp(current/goal*100,0,100);
    transitionStart=now;
    if(targetPercent>=99.95){wasFull=false;completionStarted=-1;}

    activeDonations.push({
      started:now,tier,amount:value,
      strength:config.strength,particles:config.particles,
      seed:Math.random()
    });
    while(activeDonations.length>6)activeDonations.shift();

    if(donationToast){
      const safeDonor=String(donorName||'').trim().slice(0,36);
      donationToast.textContent=(safeDonor?safeDonor+' · ':'')+'+'+formatAmount(value);
      donationToast.classList.add('show');
      if(donationToastTimer)clearTimeout(donationToastTimer);
      donationToastTimer=setTimeout(()=>donationToast.classList.remove('show'),2300);
    }
    return true;
  }

    window.TearsWidget={
    setBaseline:(state={})=>{
      const nextCurrent=Number(state.current_amount);
      const nextGoal=Number(state.goal_amount);
      if(Number.isFinite(nextCurrent)&&nextCurrent>=0)current=nextCurrent;
      if(Number.isFinite(nextGoal)&&nextGoal>0)goal=nextGoal;
      const nextCurrency=String(state.currency||currency||'RUB').toUpperCase();
      if(currencySymbols[nextCurrency])currency=nextCurrency;
      document.getElementById('currentLabel').textContent=formatAmount(current);
      document.getElementById('goalLabel').textContent=formatAmount(goal);
      transitionFrom=shownPercent;
      targetPercent=clamp(current/goal*100,0,100);
      transitionStart=performance.now();
      if(targetPercent>=99.95){wasFull=false;completionStarted=-1;}
    },
    triggerDonation:(amount,donorName,eventId)=>triggerDonation(amount,donorName,eventId),
    getState:()=>({current,goal,currency,percent:clamp(current/goal*100,0,100)})
  };
  window.addEventListener('tears:donation',event=>{
    const data=event.detail||{};
    triggerDonation(data.amount??data.value,data.username??data.donor??data.name??'',data.id??data.eventId??'');
  });
  window.addEventListener('message',event=>{
    const data=event.data;
    if(!data||data.type!=='tears:donation')return;
    triggerDonation(data.amount??data.value,data.username??data.donor??data.name??'',data.id??data.eventId??'');
  });

  function drawLiquid(percent,time){
    ctx.clearRect(0,0,W,H);
    bctx.clearRect(0,0,W,H);
    surfaceCtx.clearRect(0,0,W,H);
    const fillPercent=clamp(percent,0,100);
    const full=fillPercent>=99.95;

    if(full&&!wasFull){completionStarted=time;}
    if(!full){completionStarted=-1;}
    wasFull=full;

    if(fillPercent>0.001){
      const level=levelFor(fillPercent);
      const phase=time*0.00078;
      const amp=full?0:3.15*liquidSettings.wave;
      const donationWave=(x)=>{
        let impulse=0;
        for(const event of activeDonations){
          const age=(time-event.started)/1000;
          if(age<0||age>1.8)continue;
          const fade=Math.exp(-age*2.15);
          const distance=Math.exp(-Math.abs(x-cx)/92);
          impulse+=event.strength*4.2*fade*Math.sin((x-cx)*0.035-age*11.5)*distance;
        }
        return impulse;
      };
      const yAt=x=>level+amp*(
        0.68*Math.sin((x-769)*0.018+phase)+
        0.25*Math.sin((x-769)*0.039-phase*0.72)+
        0.12*Math.sin((x-769)*0.010-phase*0.42)
      )+donationWave(x);
      const left=755,right=1029;

      bctx.save();
      bctx.beginPath();
      bctx.moveTo(left,yAt(left));
      bctx.bezierCurveTo(798,yAt(798)-0.55,850,yAt(850)-1.0,cx,yAt(cx)-0.85);
      bctx.bezierCurveTo(934,yAt(934)-0.7,986,yAt(986)-0.4,right,yAt(right));
      bctx.lineTo(right,bottom+15);
      bctx.lineTo(left,bottom+15);
      bctx.closePath();

      const grad=bctx.createLinearGradient(0,level-6,0,bottom+8);
      grad.addColorStop(0,'#34dafa');
      grad.addColorStop(0.10,'#18bce9');
      grad.addColorStop(0.34,'#1198d5');
      grad.addColorStop(0.72,'#0876b8');
      grad.addColorStop(1,'#064b87');
      bctx.fillStyle=grad;bctx.fill();

      const glow=bctx.createLinearGradient(0,level-3,0,level+29);
      glow.addColorStop(0,'rgba(206,251,255,0.50)');
      glow.addColorStop(0.32,'rgba(93,224,255,0.20)');
      glow.addColorStop(1,'rgba(38,176,231,0)');
      bctx.fillStyle=glow;bctx.fillRect(left,level-3,right-left,32);

      bctx.save();
      bctx.globalAlpha=0.10;
      for(let i=0;i<4;i++){
        const x=790+i*54+Math.sin(phase*1.4+i)*5;
        const shaft=bctx.createLinearGradient(x,level+8,x+12,bottom);
        shaft.addColorStop(0,'rgba(190,250,255,0.45)');
        shaft.addColorStop(1,'rgba(90,210,255,0)');
        bctx.fillStyle=shaft;
        bctx.beginPath();
        bctx.moveTo(x,level+8);bctx.lineTo(x+8,level+8);bctx.lineTo(x+25,bottom);bctx.lineTo(x+8,bottom);
        bctx.closePath();bctx.fill();
      }
      bctx.restore();

      const bubbles=[
        [0.12,0.08,1.55,0.70],[0.20,0.42,1.25,0.56],[0.29,0.76,1.75,0.62],
        [0.38,0.19,1.20,0.82],[0.47,0.59,2.05,0.54],[0.56,0.31,1.35,0.77],
        [0.65,0.72,1.70,0.58],[0.74,0.12,1.40,0.74],[0.84,0.49,1.95,0.55],
        [0.16,0.86,1.10,0.63],[0.34,0.50,1.35,0.88],[0.60,0.91,1.15,0.66],
        [0.78,0.35,1.45,0.69]
      ];
      const fullBubbleBoost=full?1.38:1;
      const bubbleCount=Math.round(bubbles.length*liquidSettings.bubbles*fullBubbleBoost);
      const depth=Math.max(8,bottom-level-10);
      for(let i=0;i<Math.min(bubbleCount,24);i++){
        const baseBubble=bubbles[i%bubbles.length];
        const cycle=Math.floor(i/bubbles.length);
        const nx=cycle%2?1-baseBubble[0]:baseBubble[0];
        const seed=(baseBubble[1]+cycle*0.29)%1;
        const r=baseBubble[2]*(cycle?0.88:1)*(full?1.08:1);
        const speed=baseBubble[3]*(cycle?1.12:1)*(full?1.22:1);
        const travel=depth+28;
        const progress=((time*0.000025*speed+seed)%1);
        const by=bottom-8-progress*travel;
        if(by<level+8||by>bottom-4)continue;
        const half=rx*Math.sqrt(Math.max(0.08,1-Math.pow((by-cy)/ry,2)));
        const bx=cx+(nx-0.5)*half*1.65+Math.sin(phase*1.8+i)*2.2;
        const br=r*(0.78+0.22*Math.sin(phase*2+i));
        const bg=bctx.createRadialGradient(bx-br*0.35,by-br*0.4,0,bx,by,br*1.35);
        bg.addColorStop(0,'rgba(225,252,255,0.20)');
        bg.addColorStop(0.58,'rgba(112,224,255,0.07)');
        bg.addColorStop(1,'rgba(55,178,231,0.015)');
        bctx.fillStyle=bg;
        bctx.beginPath();bctx.arc(bx,by,br,0,Math.PI*2);bctx.fill();
        bctx.strokeStyle='rgba(183,244,255,0.50)';bctx.lineWidth=0.65;
        bctx.beginPath();bctx.arc(bx,by,br,Math.PI*1.05,Math.PI*1.82);bctx.stroke();
        bctx.fillStyle='rgba(255,255,255,0.72)';
        bctx.beginPath();bctx.arc(bx-br*0.28,by-br*0.30,Math.max(0.45,br*0.18),0,Math.PI*2);bctx.fill();
      }
      bctx.restore();

      // The exact v64 mask is used here; no inset/erosion is applied.
      bctx.globalCompositeOperation='destination-in';
      bctx.drawImage(maskImage,0,0,W,H);
      bctx.globalCompositeOperation='source-over';
      ctx.drawImage(buffer,0,0);

      if(!full){
        surfaceCtx.save();
        surfaceCtx.beginPath();
        surfaceCtx.moveTo(783,yAt(783));
        surfaceCtx.bezierCurveTo(820,yAt(820)-0.55,964,yAt(964)-0.55,1001,yAt(1001));
        surfaceCtx.strokeStyle='rgba(7,111,166,0.38)';surfaceCtx.lineWidth=2.8;surfaceCtx.lineCap='round';surfaceCtx.stroke();

        surfaceCtx.beginPath();
        surfaceCtx.moveTo(783,yAt(783)-0.8);
        surfaceCtx.bezierCurveTo(820,yAt(820)-1.35,964,yAt(964)-1.35,1001,yAt(1001)-0.8);
        surfaceCtx.strokeStyle='rgba(190,249,255,0.78)';surfaceCtx.lineWidth=1.15;surfaceCtx.lineCap='round';surfaceCtx.stroke();

        surfaceCtx.strokeStyle='rgba(255,255,255,0.42)';surfaceCtx.lineWidth=0.7;
        surfaceCtx.beginPath();surfaceCtx.moveTo(824,yAt(824)-1.5);surfaceCtx.quadraticCurveTo(845,yAt(845)-2.4,861,yAt(861)-1.4);surfaceCtx.stroke();
        surfaceCtx.beginPath();surfaceCtx.moveTo(933,yAt(933)-1.4);surfaceCtx.quadraticCurveTo(948,yAt(948)-2.1,963,yAt(963)-1.3);surfaceCtx.stroke();
        surfaceCtx.restore();

        surfaceCtx.globalCompositeOperation='destination-in';
        surfaceCtx.drawImage(maskImage,0,0,W,H);
        surfaceCtx.globalCompositeOperation='source-over';
        ctx.drawImage(surfaceCanvas,0,0);
      }else if(liquidSettings.glow){
        // At 100%, the top of the liquid is against the inner glass edge;
        // add a couple of very soft moving glints inside the liquid, not on the metal.
        surfaceCtx.save();
        surfaceCtx.globalCompositeOperation='screen';
        const shimmerX=cx+Math.sin(time*0.0011)*19;
        const shimmerY=644+Math.sin(time*0.0016)*2;
        const shimmer=surfaceCtx.createRadialGradient(shimmerX,shimmerY,2,shimmerX,shimmerY,32);
        shimmer.addColorStop(0,'rgba(220,252,255,0.22)');
        shimmer.addColorStop(0.42,'rgba(105,225,255,0.10)');
        shimmer.addColorStop(1,'rgba(35,165,235,0)');
        surfaceCtx.fillStyle=shimmer;
        surfaceCtx.beginPath();
        surfaceCtx.ellipse(shimmerX,shimmerY,36,12,0,0,Math.PI*2);
        surfaceCtx.fill();
        surfaceCtx.strokeStyle='rgba(210,250,255,0.20)';
        surfaceCtx.lineWidth=1.1;
        surfaceCtx.beginPath();
        surfaceCtx.moveTo(852,648+Math.sin(time*0.0013)*1.5);
        surfaceCtx.quadraticCurveTo(cx,642+Math.sin(time*0.0011)*1.5,932,648+Math.sin(time*0.0014)*1.5);
        surfaceCtx.stroke();
        surfaceCtx.restore();
        surfaceCtx.globalCompositeOperation='destination-in';
        surfaceCtx.drawImage(maskImage,0,0,W,H);
        surfaceCtx.globalCompositeOperation='source-over';
        ctx.drawImage(surfaceCanvas,0,0);
      }
    }

    drawCompletion(fillPercent,time);
    drawDonationEffects(time);
  }

  window.setTestPercent=p=>{
    const next=clamp(Number(p)||0,0,100);
    transitionFrom=shownPercent;
    targetPercent=next;
    transitionStart=performance.now();
    if(instant){shownPercent=targetPercent;transitionFrom=targetPercent;}
  };
  window.setLiquidSettings=next=>{
    Object.assign(liquidSettings,next||{});
    liquidSettings.wave=clamp(Number(liquidSettings.wave)||0,0,2);
    liquidSettings.bubbles=clamp(Number(liquidSettings.bubbles)||0,0,2.2);
    liquidSettings.glow=!!liquidSettings.glow;
    liquidSettings.celebration=!!liquidSettings.celebration;
  };
  window.getLiquidSettings=()=>({...liquidSettings});

  function frame(now){
    const t=instant?1:clamp((now-transitionStart)/duration,0,1);
    const eased=1-Math.pow(1-t,3);
    shownPercent=transitionFrom+(targetPercent-transitionFrom)*eased;
    if(now-lastFrame>=32||lastFrame===0){
      drawLiquid(shownPercent,now);
      lastFrame=now;
    }
    requestAnimationFrame(frame);
  }
  maskImage.onload=()=>{
    window.__liquidReady=true;
    if(status)status.textContent='Маска загружена. Выбери уровень и настройки эффектов.';
    transitionStart=performance.now();
    requestAnimationFrame(frame);
  };
  maskImage.onerror=()=>{if(status)status.textContent='ОШИБКА: не загрузилась assets/liquid_mask.png';};
  maskImage.src='assets/liquid_mask.png';
})();
</script>
<script src="../config.js"></script>
<script src="../da-cloudflare.js"></script>
</body>
