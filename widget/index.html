<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Донат-бар «Слёзы»</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}.stage{width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden}.art{position:relative;width:min(100vw,200vh);aspect-ratio:1774/887}.art img{display:block;width:100%;height:100%;object-fit:contain;user-select:none}
