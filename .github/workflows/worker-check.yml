name: Check DonationAlerts integration
on:
  push:
    branches:
      - integration/donationalerts
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare Worker syntax
        run: node --input-type=module --check < worker/src/index.js
      - name: Check browser scripts
        run: |
          node --check da-cloudflare.js
          node --check widget/runtime.js
